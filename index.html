<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C7E6F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sin Filtros</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐣</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --sky:#C7E6F5;--sky2:#FFF1F6;--ink:#2A2F4A;--ink2:#6A7090;--panel:#FFFFFF;--line:#E6E3F0;
  --good:#3CBF7F;--warn:#FFAA2B;--bad:#F2545B;--water:#44AEEF;--gold:#F5B700;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#26335A;--sky2:#1A1830;--ink:#F1F2FF;--ink2:#AEB3D3;--panel:#232644;--line:#373A5E}}
:root[data-theme="dark"]{--sky:#26335A;--sky2:#1A1830;--ink:#F1F2FF;--ink2:#AEB3D3;--panel:#232644;--line:#373A5E}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);font-size:16px;
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 70%);background-attachment:fixed;min-height:100vh;padding-bottom:84px}
body.night{--sky:#1B2347;--sky2:#2B2150;--ink:#F1F2FF;--ink2:#AEB3D3;--panel:#262A4D;--line:#3A3F68}
.wrap{max-width:520px;margin:0 auto;padding:10px 14px 20px}
h1,h2,h3,.brand{font-family:'Baloo 2',system-ui,sans-serif;margin:0}
header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.brand{font-size:1.55rem;font-weight:800;flex:1;line-height:1}
.brand small{display:block;font-family:'Nunito';font-size:.75rem;color:var(--ink2);font-weight:800}
.chip{border:none;background:var(--panel);color:var(--ink);border-radius:99px;padding:6px 12px 6px 6px;font:inherit;font-weight:800;font-size:.85rem;display:flex;align-items:center;gap:6px;cursor:pointer}
.dot{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.panel{background:var(--panel);border-radius:22px;padding:14px;box-shadow:0 4px 16px rgba(20,40,70,.08);margin-top:12px}
.panel h2{font-size:1.15rem;margin-bottom:8px}
.muted{color:var(--ink2);font-size:.85rem;line-height:1.45}
.stage{position:relative;height:min(46vh,380px);touch-action:none}
.stage canvas{width:100%;height:100%;display:block}
.bubble{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:var(--panel);color:var(--ink);border-radius:18px;padding:9px 14px;font-weight:800;font-size:.95rem;width:max-content;max-width:92%;text-align:center;box-shadow:0 6px 18px rgba(20,40,70,.15);z-index:2}
.bubble::after{content:'';position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:8px solid transparent;border-top-color:var(--panel);border-bottom:0}
.tag{position:absolute;right:4px;bottom:6px;font-family:'Baloo 2';font-weight:800;font-size:.85rem;background:var(--ink);color:var(--panel);padding:3px 10px;border-radius:99px}
.ecg{position:absolute;left:4px;bottom:6px;width:120px;height:48px;background:#0E1A14;border-radius:10px;border:2px solid #2D4A3A;display:none;overflow:hidden}
.ecg.on{display:block}.ecg svg{width:100%;height:100%}
.ecg polyline{fill:none;stroke:#46F28A;stroke-width:2.5;stroke-dasharray:300;animation:ecg 1.6s linear infinite}
.ecg.flat polyline{stroke:#FF4B55;animation:none;stroke-dasharray:none}
@keyframes ecg{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
.house{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.house::-webkit-scrollbar{display:none}
.hm{flex-shrink:0;background:var(--panel);border-radius:16px;padding:6px 10px 6px 6px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:.82rem}
.hm small{display:block;font-size:.68rem;color:var(--ink2);letter-spacing:1px}
.stat{display:grid;grid-template-columns:1.6rem 1fr auto;align-items:center;gap:4px 8px;margin:8px 0}
.stat .ic{font-size:1.2rem;grid-row:span 2}.stat b{font-size:.95rem}
.stat span{text-align:right;font-weight:800;font-size:.82rem;color:var(--ink2)}
.bar{grid-column:2/4;height:14px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s ease}
.bar .zone{position:absolute;top:0;bottom:0;border-left:2px dashed rgba(0,0,0,.28);border-right:2px dashed rgba(0,0,0,.28)}
.lives{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-top:8px}
.lives .h{font-size:1.25rem;letter-spacing:2px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.act{border:none;border-radius:18px;padding:13px 6px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1rem;color:#1C2436;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
.act .e{font-size:1.6rem}.act small{font-family:'Nunito';font-size:.7rem;font-weight:800;opacity:.8}
.act:active{transform:scale(.96)}.act:disabled{opacity:.45}
.a-food{background:#FFD27A}.a-water{background:#9BD6FF}.a-move{background:#A8EBC4}.a-move.on{background:#FF9FB6}
.wide{grid-column:1/-1}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:14px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.05rem;cursor:pointer;background:var(--ink);color:var(--panel);margin-top:10px}
.btn.sec{background:var(--line);color:var(--ink)}.btn.bad{background:var(--bad);color:#fff}.btn.gold{background:var(--gold);color:#2A2F4A}
.btn:disabled{opacity:.45}
button:focus-visible,input:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:11px;font:inherit;font-weight:800;font-size:.92rem;text-align:left;cursor:pointer}
.opt small{display:block;font-weight:600;color:var(--ink2);font-size:.75rem;margin-top:2px}
.opt.sel{border-color:var(--ink);background:var(--line)}
.code{font-family:'Baloo 2';font-size:1.7rem;font-weight:800;letter-spacing:2px;text-align:center;background:repeating-linear-gradient(0deg,var(--panel),var(--panel) 26px,var(--line) 27px);border-radius:12px;padding:6px;margin:6px 0}
input.in{width:100%;padding:13px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:800;font-size:1.2rem;text-align:center}
label.lb{font-weight:800;font-size:.9rem;display:block;margin:10px 0 5px}
.shot{display:flex;align-items:center;gap:10px;border:2px dashed var(--line);border-radius:14px;padding:10px;margin-top:8px;cursor:pointer;background:transparent;color:var(--ink);font:inherit;font-weight:800;width:100%}
.shot img{width:48px;height:48px;object-fit:cover;border-radius:10px}
.meal{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:none}
.meal .k{font-weight:800;white-space:nowrap}
.q{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.gossip h3{font-size:1.05rem;margin-bottom:6px}
.gossip p{margin:0;line-height:1.55;white-space:pre-line}
/* feed */
.post{background:var(--panel);border-radius:20px;margin-top:12px;overflow:hidden;box-shadow:0 4px 16px rgba(20,40,70,.08)}
.post .hd{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:800}
.post .hd small{color:var(--ink2);font-weight:700;margin-left:auto;font-size:.8rem}
.post .ph{position:relative;background:var(--line);aspect-ratio:1}
.post .ph img{width:100%;height:100%;object-fit:cover;display:block}
.stamp{position:absolute;left:10px;top:10px;padding:4px 10px;border-radius:8px;font-weight:800;font-size:.8rem;background:var(--bad);color:#fff;transform:rotate(-4deg)}
.stamp.eye{background:#FFAA2B;color:#2A2F4A}
.post .bd{padding:10px 12px}
.reacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.rx{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:5px 10px;font:inherit;font-weight:800;font-size:.85rem;cursor:pointer}
.rx.mine{background:var(--line);border-color:var(--ink2)}
.rx.sus{margin-left:auto;border-color:var(--bad);color:var(--bad)}
/* semana / ranking */
.duel{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.duel:first-of-type{border-top:none}
.duel .side{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;text-align:center}
.duel .pts{font-family:'Baloo 2';font-size:1.5rem}
.duel .vs{font-family:'Baloo 2';font-weight:800;color:var(--bad)}
.win{color:var(--good)}
.rank{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
.rank:first-of-type{border-top:none}
.rank .pos{font-family:'Baloo 2';font-weight:800;width:1.6rem;text-align:center;font-size:1.2rem}
.rank .nm{flex:1;font-weight:800}
.rank .nm small{display:block;color:var(--ink2);font-weight:700;font-size:.76rem}
.rank .pt{font-family:'Baloo 2';font-weight:800;font-size:1.35rem}
.badge{display:inline-block;font-size:.66rem;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--bad);color:#fff;margin-left:4px;vertical-align:middle}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.num{background:var(--line);border-radius:14px;padding:10px;text-align:center}
.num b{display:block;font-family:'Baloo 2';font-size:1.25rem}
.num span{font-size:.72rem;color:var(--ink2);font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.cal i{aspect-ratio:1;border-radius:6px;background:var(--line);display:block}
.cal i.p{background:#2FA86B}.cal i.o{background:#8FDDB1}.cal i.y{background:#FFD166}.cal i.r{background:#F2545B}.cal i.d{background:#222}.cal i.t{outline:2px solid var(--ink)}
.brk{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:.9rem}
.brk:first-child{border-top:none}
.plates{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.plates button{padding:0;border:3px solid transparent;border-radius:12px;overflow:hidden;aspect-ratio:1;cursor:pointer;background:var(--line)}
.plates button.sel{border-color:var(--gold)}
.plates img{width:100%;height:100%;object-fit:cover;display:block}
.guide h3{font-size:1rem;margin:12px 0 4px}
.guide ul{margin:4px 0;padding-left:1.2rem;line-height:1.55}
/* nav, toast, loader */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);display:flex;justify-content:space-around;
  padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 18px rgba(20,40,70,.12)}
nav button{border:none;background:none;color:var(--ink2);font:inherit;font-weight:800;font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 8px;cursor:pointer}
nav button span{font-size:1.4rem}
nav button.on{color:var(--ink)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:14px;font-weight:800;font-size:.92rem;z-index:50;width:max-content;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.load{position:fixed;inset:0;background:rgba(20,24,44,.6);z-index:40;display:none;align-items:center;justify-content:center;padding:24px}
.load.on{display:flex}
.load div{background:var(--panel);color:var(--ink);border-radius:20px;padding:22px;text-align:center;font-weight:800;max-width:320px}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--gold);margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.pulse,.ecg polyline,.spin{animation:none}}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Sin Filtros 📸<small id="dayChip">Cargando…</small></div>
    <button class="chip" id="userChip" type="button"></button>
  </header>

  <section id="vCasa">
    <div class="house" id="house"></div>
    <div class="stage" id="stage">
      <canvas id="c" aria-label="Tu pollita en 3D, arrástrala para girarla"></canvas>
      <div class="bubble" id="bubble">Pío pío</div>
      <div class="ecg" id="ecg"><svg viewBox="0 0 120 48" preserveAspectRatio="none"><polyline id="ecgLine" points=""/></svg></div>
      <div class="tag" id="stateTag">…</div>
    </div>
    <div id="casaBody"></div>
  </section>
  <section id="vOtro" class="hidden"></section>
</div>

<nav>
  <button data-t="casa" class="on" type="button"><span>🐣</span>Casa</button>
  <button data-t="feed" type="button"><span>📸</span>Feed</button>
  <button data-t="semana" type="button"><span>⚔️</span>Semana</button>
  <button data-t="ranking" type="button"><span>🏆</span>Ranking</button>
  <button data-t="guia" type="button"><span>📖</span>Guía</button>
</nav>
<div class="toast" id="toast"></div>
<div class="load" id="load"><div><div class="spin"></div><span id="loadTxt">Subiendo…</span></div></div>

<script>
/* =====================================================
   CONFIG — pega aquí la URL de tu Apps Script (/exec)
   ===================================================== */
const API = 'https://script.google.com/macros/s/AKfycbwLey3lgmRZr0zHryRGxgo2mtgW0aZdWjzWJpShMElcPLA_-EnmOfMKZ_JNN2_jZYfk/exec';

const PALABRAS=['MANGO','COCO','FRESA','KIWI','PAPAYA','GUAYABA','MORA','UVA','PERA','MELON','CEREZA','NARANJA','TOMATE','PEPINO','CHOCLO','YUCA','GALLINA','POLLITA','HUEVO','PLUMA','NIDO','MAIZ','LORO','TORTUGA','BALLENA','ESTRELLA','LIMA','PIMIENTO','CANELA','AVENA'];
const PROG_FECHAS=['2026-10-01','2026-11-01','2026-12-01','2026-12-31'];
const DEC='2026-12-15';
const EMO={feliz:'😊',normal:'🙂',dormida:'😴',preocupado:'😢',sed:'🥵',empachado:'🎈',debil:'😩',enfermo:'🤒',uci:'🚑',muerto:'👻'};
const LABEL={feliz:'Feliz',normal:'Normal',dormida:'Dormida',preocupado:'Triste',sed:'Deshidratada',empachado:'Empachada',debil:'Sin comer',enfermo:'Enferma',uci:'Terapia intensiva',muerto:'Muerta'};
const MSG={
  feliz:['¡Pío pío! Soy la pollita más feliz de la casa 💛','Me siento como en comercial de yogur ✨','Te quiero muchísimo, gracias por cuidarme 🥹'],
  normal:['Pío… estoy bien, creo','Ni fu ni fa, pero aquí sigo','¿Me das un poquito más de cariño?'],
  dormida:['Zzz… pío… zzz','Shhh, estoy soñando con lechuga 😴','Mañana a las 10 me das agüita'],
  preocupado:['¿Ya no me quieres? 🥺','Ayer me descuidaste… me dolió el corazoncito 💔','Las demás pollitas me miran con lástima'],
  sed:['Me estoy secando como pasa 🥵','A… agua… por favor… 💧','Siento que me convierto en pollo al horno'],
  empachado:['Creo que me tragué un globo 🎈','No me hables, estoy digiriendo…','Necesito una siesta y una manzanilla'],
  debil:['Ya es tarde y no he almorzado… 😩','Veo pollos asados flotando… ay no, esos somos nosotras','Me tiemblan las patitas de hambre'],
  enfermo:['Me siento fatal… llama a alguien 🤒','Tengo fiebre de abandono','Si me muero, que conste que avisé 😭'],
  uci:['Está en terapia intensiva. Los doctores dicen que depende de ti 🚑','bip… bip… bip…','Sus últimas palabras fueron: “agüita”'],
  muerto:['Aquí yace una pollita que merecía más 🕯️','Descansa en paz. Toda la casa ya se enteró','Se fue… y no le diste ni agua ⚰️']
};
const RETOS_SALV=[
  {t:'Hacer 150 minutos de ejercicio en la semana',ok:s=>s.move>=150,p:s=>s.move+' de 150 min'},
  {t:'Agua perfecta 5 días de la semana',ok:s=>s.water>=5,p:s=>s.water+' de 5 días'},
  {t:'5 días con la comida en su rango',ok:s=>s.food>=5,p:s=>s.food+' de 5 días'},
  {t:'3 días perfectos en la semana',ok:s=>s.perfect>=3,p:s=>s.perfect+' de 3 días'}
];
const REACTS=['🔥','💚','👀','🫢'];

/* ================= UTILIDADES ================= */
const $=id=>document.getElementById(id);
const pad=v=>String(v).padStart(2,'0');
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const fechaDe=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoyStr=()=>fechaDe(new Date());
const horaStr=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const hNow=()=>{const d=new Date();return d.getHours()+d.getMinutes()/60};
const hDe=s=>{const m=String(s??'').match(/(\d{1,2}):(\d{2})/);return m?+m[1]+(+m[2])/60:null};
const n=v=>{if(v===null||v===undefined||v==='')return null;const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?null:x};
const bool=v=>v===true||['TRUE','VERDADERO','SI','SÍ','1'].includes(String(v).trim().toUpperCase());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const toUTC=f=>{const p=f.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2])};
const fromUTC=t=>{const d=new Date(t);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
const addDays=(f,k)=>fromUTC(toUTC(f)+k*864e5);
const dow=f=>new Date(toUTC(f)).getUTCDay();
function hash(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h}
function codigoDelDia(f){const h=hash(f+'gallinero');return PALABRAS[h%PALABRAS.length]+' '+(10+(Math.floor(h/7)%90))}
const groupBy=(arr,k)=>arr.reduce((m,x)=>{const key=String(x[k]).slice(0,10);(m[key]=m[key]||[]).push(x);return m},{});
const fmtF=f=>{const d=new Date(toUTC(f));return ['dom','lun','mar','mié','jue','vie','sáb'][d.getUTCDay()]+' '+d.getUTCDate()+' '+['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][d.getUTCMonth()]};
let tt;function toast(t,ms){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),ms||3000)}
function loading(t){if(t){$('loadTxt').textContent=t;$('load').classList.add('on')}else $('load').classList.remove('on')}

/* ================= ESTADO GLOBAL ================= */
let D=null,G=null,tab='casa',me=Number(LS.get('gal_me'))||null,pin=LS.get('gal_pin')||'';
let ui={food:false,last:null,pesaje:{b:null,c:null},loginPid:null,rankSel:null,vote:{nom:null,plate:null,plates:null},progFotos:null};
let FEED={items:[],done:false,busy:false};

/* ================= API ================= */
async function load(silencioso){
  if(!silencioso){const c=LS.get('gal_cache');if(c){try{D=JSON.parse(c);calc();render()}catch(e){}}}
  try{
    const r=await fetch(API+'?accion=todo');const j=await r.json();
    if(!j.ok)throw new Error(j.error||'Error del servidor');
    D=j;LS.set('gal_cache',JSON.stringify(j));calc();render();
  }catch(e){
    if(!D){$('casaBody').innerHTML=`<div class="panel"><h2>😕 No pude conectar</h2><p class="muted">${esc(e.message)}</p><button class="btn" type="button" onclick="location.reload()">Reintentar</button></div>`}
    else toast('⚠️ Sin conexión: mostrando lo último guardado');
  }
}
async function post(accion,datos){
  const r=await fetch(API,{method:'POST',body:JSON.stringify({accion,datos:Object.assign({pid:me,pin},datos)})});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Error');return j;
}

/* ================= CÁLCULOS ================= */
function primerLunes(ini){return addDays(ini,((8-dow(ini))%7)||7)}
function semanaDe(f,ini){const L=primerLunes(ini);if(f<L)return 1;return 2+Math.floor((toUTC(f)-toUTC(L))/(7*864e5))}
function inicioSemana(w,ini){return w===1?ini:addDays(primerLunes(ini),7*(w-2))}
function finSemana(w,ini,fin){const L=primerLunes(ini);const f=w===1?addDays(L,-1):addDays(L,7*(w-1)-1);return f>fin?fin:f}
function metaKcal(p,lb){
  const kg=(lb||0)/2.20462,est=n(p.estatura_cm),ed=n(p.edad);
  if(!kg||!est||!ed)return 1500;
  const t=(10*kg+6.25*est-5*ed-161)*1.375-400;return Math.max(1300,Math.round(t/50)*50);
}
function estado(x,H){
  if(x.dead)return'muerto';
  if(x.bad>=3||x.dryNow>=5)return'uci';
  if(x.bad>=2||x.dryNow>=2)return'enfermo';
  if(!x.awake)return'dormida';
  if(x.water<30)return'sed';
  if(x.ratio>x.hi||x.bomba)return'empachado';
  if(H>=15&&!x.lunch)return'debil';
  if(x.bad>=1)return'preocupado';
  const ex=clamp((H-10)/10,0,1);
  if(x.water>55&&x.ratio>=ex*.45&&x.move>=ex*15)return'feliz';
  return'normal';
}
function dayPts(e,parcial){
  const base=Math.min(3,e.sanos)+Math.min(6,Math.floor(e.move/10));
  if(parcial)return base;
  return base+(e.foodOk?2:0)+(e.waterOk?2:0)+(e.moveOk?2:0)+(e.perfect?(e.f>=DEC?6:3):0);
}

function calc(){
  const c=D.config,ini=String(c.fecha_inicio).slice(0,10),fin=String(c.fecha_fin).slice(0,10);
  const hoy=hoyStr(),H=hNow(),hoyC=hoy>fin?fin:(hoy<ini?ini:hoy);
  const act=D.participantes.filter(p=>p.nombre&&String(p.activo).trim().toUpperCase()!=='FALSE'&&String(p.activo).trim().toUpperCase()!=='FALSO').map(p=>Object.assign({},p,{id:Number(p.id)}));

  // denuncias → fotos anuladas
  const owner={};
  D.comidas.forEach(x=>owner[x.id]=Number(x.participante_id));
  D.ejercicio.forEach(x=>{owner[x.id+'_ini']=Number(x.participante_id);owner[x.id+'_fin']=Number(x.participante_id)});
  const need=Math.max(1,Math.min(2,act.length-1));
  const den={};D.denuncias.forEach(d=>{const o=owner[d.foto_id];if(o===undefined||o===Number(d.participante_id))return;(den[d.foto_id]=den[d.foto_id]||new Set()).add(Number(d.participante_id))});
  const anul=new Set(Object.keys(den).filter(k=>den[k].size>=need));
  const sesAnul=new Set(D.ejercicio.filter(x=>anul.has(x.id+'_ini')||anul.has(x.id+'_fin')).map(x=>x.id));
  const fechaFoto={};D.comidas.forEach(x=>fechaFoto[x.id]=x.fecha);D.ejercicio.forEach(x=>{fechaFoto[x.id+'_ini']=x.fecha;fechaFoto[x.id+'_fin']=x.fecha});

  // fechas de pesaje obligatorio: inicio + cada domingo + final
  const req=[ini];for(let w=1;;w++){const f=finSemana(w,ini,fin);if(!req.includes(f))req.push(f);if(f>=fin)break}

  const P=act.map(p=>{
    const id=p.id,desde=String(p.desde||ini).slice(0,10)||ini;
    const com=D.comidas.filter(x=>Number(x.participante_id)===id&&!anul.has(x.id));
    const comBy=groupBy(com,'fecha');
    const agBy=groupBy(D.agua.filter(x=>Number(x.participante_id)===id),'fecha');
    const ejAll=D.ejercicio.filter(x=>Number(x.participante_id)===id);
    const ejBy=groupBy(ejAll.filter(x=>x.estado==='ok'&&!sesAnul.has(x.id)),'fecha');
    const pes=D.pesajes.filter(x=>Number(x.participante_id)===id&&n(x.peso_lb)).sort((a,b)=>a.fecha<b.fecha?-1:1);
    const pesoIni=pes.length?n(pes[0].peso_lb):null,cintIni=pes.length?n(pes[0].cintura_cm):null;
    const pesoAct=pes.length?n(pes[pes.length-1].peso_lb):null,cintAct=pes.length?n(pes[pes.length-1].cintura_cm):null;
    const meta=metaKcal(p,pesoAct);

    function evalDay(f){
      const cs=comBy[f]||[];
      const kcal=cs.reduce((s,x)=>s+(n(x.kcal)||0),0);
      const qs=cs.filter(x=>n(x.calidad)!==null);const q=qs.length?qs.reduce((s,x)=>s+n(x.calidad),0)/qs.length:0;
      const lunch=cs.some(x=>x.tipo==='almuerzo');
      const hi=f>=DEC?1.35:1.2,ratio=kcal/meta;
      const foodOk=lunch&&ratio>=.6&&ratio<=hi&&q>=.45;
      const hrs=(agBy[f]||[]).map(x=>hDe(x.hora)).filter(h=>h!==null&&h>=10&&h<20).sort((a,b)=>a-b);
      let prev=10,dry=0;hrs.forEach(h=>{dry+=Math.max(0,h-prev-3);prev=h});dry+=Math.max(0,20-prev-3);
      const move=(ejBy[f]||[]).reduce((s,x)=>s+(n(x.minutos)||0),0);
      const waterOk=dry<2,moveOk=move>=15;
      const fails=[foodOk,waterOk,moveOk].filter(x=>!x).length;
      return{f,kcal,q,lunch,ratio,hi,foodOk,dry,waterOk,move,moveOk,fails,perfect:fails===0&&move>=30,
        sanos:cs.filter(x=>n(x.calidad)>=.7).length,meals:cs,drinks:hrs.length,
        bomba:cs.some(x=>n(x.calidad)!==null&&n(x.calidad)<.15&&(n(x.kcal)||0)>=600)};
    }

    // vidas día por día
    const rev=D.revivir.filter(x=>Number(x.participante_id)===id).map(x=>String(x.fecha).slice(0,10));
    let bad=0,dead=false,deaths=0,lost=0,revives=0;const days=[];
    for(let f=desde;f<hoy&&f<=fin;f=addDays(f,1)){
      rev.filter(r=>r===f).forEach(()=>{if(dead){dead=false;bad=2;revives++}});
      if(dead){days.push({f,dead:true,fails:3,move:0,sanos:0});continue}
      const e=evalDay(f);
      if(e.fails>=2){bad++;lost++;e.lost=true}else if(e.fails===0&&bad>0){bad--;e.won=true}
      if(bad>=4){dead=true;deaths++;e.died=true}
      days.push(e);
    }
    rev.filter(r=>r===hoy).forEach(()=>{if(dead){dead=false;bad=2;revives++}});
    const today=evalDay(hoy);

    // agua en vivo
    const awake=H>=10&&H<20&&hoy>=desde&&hoy<=fin;
    const td=(agBy[hoy]||[]).map(x=>hDe(x.hora)).filter(h=>h!==null&&h>=10&&h<=H+.01).sort((a,b)=>a-b);
    const last=td.length?td[td.length-1]:null;
    const base=last!==null?100:60,since=awake?H-(last??10):0;
    const water=awake?clamp(base-since*33.33):(last!==null?100:60);
    const dryNow=awake?Math.max(0,since-base/33.33):0;
    const st=hoy<desde||hoy<ini?'normal':estado({dead,bad,dryNow,awake,water,ratio:today.ratio,hi:today.hi,bomba:today.bomba,lunch:today.lunch,move:today.move},H);
    const open=ejAll.find(x=>x.estado==='en_curso'&&x.fecha===hoy);

    // pesajes
    const pesF=new Set(pes.map(x=>String(x.fecha).slice(0,10)));
    let ptsPes=0,faltaPes=0;
    req.filter(r=>r>=desde).forEach(r=>{if(pesF.has(r)||pesF.has(addDays(r,1)))ptsPes+=5;else if(hoy>addDays(r,1)){ptsPes-=10;faltaPes++}});

    return Object.assign({},p,{com,ejAll,pes,pesoIni,cintIni,pesoAct,cintAct,meta,evalDay,days,today,bad,dead,deaths,lost,revives,
      water,dryNow,awake,st,open,pesF,ptsPes,faltaPes,desde,
      anuladas:[...anul].filter(k=>owner[k]===id),
      acertadas:[...anul].filter(k=>den[k].has(id)).length});
  });
  const byId={};P.forEach(x=>byId[x.id]=x);

  // semanas, duelos, votos
  const curW=semanaDe(hoyC,ini);const weeks=[];
  const ids=P.map(x=>x.id).sort((a,b)=>a-b);
  function pares(w){
    const arr=ids.slice();if(arr.length%2)arr.push(0);
    const m=arr.length;if(m<2)return[];
    const fixed=arr[0],rest=arr.slice(1),k=(w-1)%(m-1);
    const rot=rest.slice(k).concat(rest.slice(0,k));const all=[fixed].concat(rot);
    const out=[];for(let i=0;i<m/2;i++)out.push([all[i],all[m-1-i]]);return out;
  }
  function wkStats(x,w){
    const a=inicioSemana(w,ini),b=finSemana(w,ini,fin);
    let pts=0,move=0,water=0,food=0,perfect=0;
    x.days.filter(e=>e.f>=a&&e.f<=b&&!e.dead).forEach(e=>{pts+=dayPts(e);move+=e.move;if(e.waterOk)water++;if(e.foodOk)food++;if(e.perfect)perfect++});
    if(hoy>=a&&hoy<=b){pts+=dayPts(x.today,true);move+=x.today.move}
    if(x.pesF.has(b)||x.pesF.has(addDays(b,1)))pts+=5;
    return{pts,move,water,food,perfect};
  }
  for(let w=1;w<=curW;w++){
    const a=inicioSemana(w,ini),b=finSemana(w,ini,fin),done=hoy>b;
    const st={};P.forEach(x=>st[x.id]=wkStats(x,w));
    const avg=P.length?Math.round(P.reduce((s,x)=>s+st[x.id].pts,0)/P.length):0;
    const duels=pares(w).map(([i,j])=>{const pi=i?st[i].pts:avg,pj=j?st[j].pts:avg;
      return{a:i,b:j,pa:pi,pb:pj,win:done?(pi>pj?i:pj>pi?j:'empate'):null}});
    const v=(D.votos||{})[w]||{};
    let nominadas=[],platoWin=[];
    if(v.cerrada){
      const nm=v.nominaciones||{},mx=Math.max(0,...Object.values(nm));
      if(mx>0)nominadas=Object.keys(nm).filter(k=>nm[k]===mx).map(Number);
      const pl=v.platos||{},mp=Math.max(0,...Object.values(pl));
      if(mp>0)platoWin=Object.keys(pl).filter(k=>pl[k]===mp);
    }
    weeks.push({w,a,b,done,st,duels,v,nominadas,platoWin,reto:RETOS_SALV[hash('s'+w)%RETOS_SALV.length]});
  }

  // puntos totales
  P.forEach(x=>{
    const B={};
    B['Días cumplidos']=x.days.filter(e=>!e.dead).reduce((s,e)=>s+dayPts(e),0)+dayPts(x.today,true);
    B['Pesajes']=x.ptsPes;
    B['Cintura']=(x.cintIni&&x.cintAct)?Math.round((x.cintIni-x.cintAct)*4):0;
    B['Peso']=(x.pesoIni&&x.pesoAct)?Math.round((x.pesoIni-x.pesoAct)/x.pesoIni*100*3):0;
    let du=0,pl=0,nom=0,salv=0;
    weeks.forEach(W=>{
      W.duels.forEach(d=>{if(!d.win)return;if(d.win===x.id)du+=8;else if(d.win==='empate'&&(d.a===x.id||d.b===x.id))du+=3});
      if(W.platoWin.some(fid=>owner[fid]===x.id))pl+=5;
      if(W.nominadas.includes(x.id)){nom-=5;const N=weeks[W.w];if(N&&N.done)salv+=W.reto.ok(N.st[x.id])?10:-10}
    });
    B['Duelos']=du;B['Mejor plato']=pl;B['Nominaciones']=nom;B['Reto de salvación']=salv;
    B['Trampas detectadas']=x.acertadas*10;B['Fotos anuladas']=-15*x.anuladas.length;
    B['Vidas perdidas']=-5*x.lost;B['Muertes']=-20*x.deaths;B['Revivir']=-20*x.revives;
    B['Fotos de progreso']=3*new Set(D.progreso.filter(r=>Number(r.participante_id)===x.id).map(r=>r.fecha)).size;
    const baseDic=x.pes.filter(r=>r.fecha<=DEC).pop(),finalP=x.pes.filter(r=>r.fecha>=fin).pop();
    B['Sobrevivir diciembre']=(baseDic&&finalP&&n(finalP.peso_lb)<=n(baseDic.peso_lb))?20:0;
    x.B=B;x.pts=Object.values(B).reduce((s,v)=>s+v,0);
    x.tramposa=x.anuladas.some(k=>fechaFoto[k]>=addDays(hoy,-7));
  });
  const ranking=P.slice().sort((a,b)=>b.pts-a.pts);
  G={ini,fin,hoy,H,hoyC,P,byId,weeks,curW,ranking,anul,den,owner,need,req,
    dia:Math.max(1,Math.min(Math.round((toUTC(hoyC)-toUTC(ini))/864e5)+1,92)),
    total:Math.round((toUTC(fin)-toUTC(ini))/864e5)+1};
}

/* ================= RENDER ================= */
function render(){
  if(!G)return;
  document.body.classList.toggle('night',!(G.H>=10&&G.H<20));
  $('dayChip').textContent=G.hoy<G.ini?'Empieza el '+fmtF(G.ini):(G.hoy>G.fin?'¡Terminó el reto!':'Día '+G.dia+' de '+G.total+' · Semana '+G.curW);
  const m=me&&G.byId[me];
  $('userChip').innerHTML=m?`<span class="dot" style="background:${m.color}">${EMO[m.st]}</span>${esc(m.nombre)}`:'<span class="dot" style="background:var(--line)">👤</span>Entrar';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('vCasa').classList.toggle('hidden',tab!=='casa');$('vOtro').classList.toggle('hidden',tab==='casa');
  if(tab==='casa')renderCasa();
  else if(tab==='feed')renderFeed();
  else if(tab==='semana')renderSemana();
  else if(tab==='ranking')renderRanking();
  else renderGuia();
}
const hearts=x=>'❤️'.repeat(4-Math.min(x.bad,4))+'🖤'.repeat(Math.min(x.bad,4));
const dotP=(x,size)=>`<span class="dot" style="background:${x?x.color:'#ddd'};${size?`width:${size}px;height:${size}px;font-size:${size/2.2}px`:''}">${x?EMO[x.st]:'👻'}</span>`;
const nom=id=>id===0?'Pollita fantasma':(G.byId[id]?G.byId[id].nombre:'?');

/* ---------- CASA ---------- */
function renderCasa(){
  $('house').innerHTML=G.P.filter(x=>x.id!==me).map(x=>`<div class="hm">${dotP(x)}<div>${esc(x.nombre)} · ${LABEL[x.st]}<small>${hearts(x)}</small></div></div>`).join('');
  if(!me||!G.byId[me]){petSet({st:'normal',color:'#FFD84D',water:80,awake:true,name:'Pío'});$('casaBody').innerHTML=loginHTML();return}
  const x=G.byId[me],t=x.today,hoy=G.hoy;
  petSet({st:x.st,color:x.color||'#FFD84D',water:x.water,awake:x.awake,name:x.nombre});
  let h='';
  if(G.hoy<G.ini)h+=`<div class="panel"><h2>⏳ Sin Filtros empieza el ${fmtF(G.ini)}</h2><p class="muted">Tu pollita te espera. Ese día te pesas, mides tu cintura y te tomas tu foto de progreso.</p></div>`;
  if(hoy>=DEC&&hoy<=G.fin)h+=`<div class="panel" style="border:2px solid var(--gold)"><h2>🎄 Modo diciembre</h2><p class="muted">La regla ahora es no subir. Los días perfectos valen el doble y si el 31 pesas igual o menos que el 13 de diciembre, ganas +20.</p></div>`;

  // barras
  const r=t.ratio;const zoneL=.6/1.5*100,zoneW=(t.hi-.6)/1.5*100;
  const fc=(r>=.6&&r<=t.hi)?'var(--good)':(r>t.hi?'var(--bad)':'var(--warn)');
  const mc=t.move>=30?'var(--good)':t.move>=15?'var(--warn)':'var(--bad)';
  h+=`<div class="panel">
    <div class="stat"><span class="ic">🍽️</span><b>Comida de hoy</b><span>${t.kcal} / ${x.meta} kcal</span><div class="bar"><div class="zone" style="left:${zoneL}%;width:${zoneW}%"></div><i style="width:${clamp(r/1.5*100)}%;background:${fc}"></i></div></div>
    <div class="stat"><span class="ic">💧</span><b>${x.awake?'Agua':'Agua · en pausa'}</b><span>${x.awake?Math.round(x.water)+'%':'10:00–20:00'}</span><div class="bar"><i style="width:${x.water}%;background:${x.water<30?'var(--bad)':'var(--water)'}"></i></div></div>
    <div class="stat"><span class="ic">⚡</span><b>Movimiento de hoy</b><span>${t.move} / 30 min</span><div class="bar"><i style="width:${clamp(t.move/30*100)}%;background:${mc}"></i></div></div>
    <div class="lives"><span>Vidas</span><span class="h">${hearts(x)}</span></div>`;
  if(x.dead){
    h+=`<button class="btn bad" type="button" onclick="revivir()">⚡ Revivir a mi pollita (−20 puntos, lo ven todas)</button>`;
  }else{
    const exLbl=x.open?`<span class="e">🏁</span>Terminar<small>${Math.round((Date.now()-n(x.open.ts_inicio))/60000)} min</small>`:`<span class="e">💪</span>Ejercicio<small>foto con código</small>`;
    h+=`<div class="actions">
      <button class="act a-food" type="button" onclick="ui.food=!ui.food;renderCasa()"><span class="e">📸</span>Comida</button>
      <button class="act a-water" type="button" onclick="darAgua()" ${x.awake?'':'disabled'}><span class="e">💧</span>Agua<small>${x.awake?'':'de 10 a 20'}</small></button>
      <button class="act a-move ${x.open?'on':''}" type="button" onclick="${x.open?'finEjercicio()':'iniEjercicio()'}">${exLbl}</button>
    </div>`;
    if(ui.food)h+=`<div class="grid2">
      <button class="opt" type="button" onclick="hacerComida('desayuno')">🥞 Desayuno</button>
      <button class="opt" type="button" onclick="hacerComida('almuerzo')" style="border-color:var(--gold)">🍲 Almuerzo<small>Obligatorio</small></button>
      <button class="opt" type="button" onclick="hacerComida('cena')">🌙 Cena</button>
      <button class="opt" type="button" onclick="hacerComida('snack')">🍎 Snack</button></div>
      <p class="muted" style="margin:8px 2px 0">La cámara se abre directo. Fotos de galería o de internet no valen.</p>`;
  }
  h+='</div>';

  if(ui.last)h+=`<div class="panel" style="border:2px solid var(--water)"><h2>${esc(ui.last.titulo)}</h2><p style="margin:0;font-weight:800">${esc(ui.last.txt)}</p>${ui.last.sub?`<p class="muted" style="margin-top:6px">${esc(ui.last.sub)}</p>`:''}</div>`;

  // código del día
  h+=`<div class="panel"><h2>✍️ Código de hoy</h2><div class="code">${codigoDelDia(hoy)}</div>
    <p class="muted" style="margin:0">Escríbelo en un papel. Debe verse en tus 2 fotos de ejercicio (al empezar y al terminar) y en las del pesaje. Sin código, no cuenta.</p></div>`;

  // pesaje
  const pf=[hoy,addDays(hoy,-1)].find(f=>G.req.includes(f)&&f>=x.desde&&!x.pesF.has(f)&&!(f!==hoy&&x.pesF.has(hoy)));
  if(pf&&hoy>=G.ini)h+=pesajeHTML(pf,x);
  else if(G.req.includes(hoy)&&x.pesF.has(hoy))h+=`<div class="panel"><h2>⚖️ Pesaje de hoy ✅</h2><p class="muted" style="margin:0">Listo. Gemini revisó tus fotos.</p></div>`;

  // progreso
  const prf=[hoy,addDays(hoy,-1)].find(f=>PROG_FECHAS.includes(f)&&!D.progreso.some(r=>Number(r.participante_id)===me&&r.fecha===f));
  if(prf)h+=`<div class="panel" style="border:2px solid var(--gold)"><h2>📷 Foto de progreso (privada)</h2>
    <p class="muted">Cuerpo completo, de frente, misma pose y mismo lugar cada mes. Solo la ves tú en la app. +3 puntos.</p>
    <button class="btn gold" type="button" onclick="fotoProgreso('${prf}')">Tomar foto de progreso</button></div>`;

  // mis comidas
  if(t.meals.length){
    h+=`<div class="panel"><h2>🍽️ Lo que comiste hoy</h2>`;
    t.meals.slice().sort((a,b)=>n(a.ts)-n(b.ts)).forEach(c=>{
      const q=n(c.calidad);const qc=q===null?'var(--line)':q>=.7?'var(--good)':q>=.4?'var(--warn)':'var(--bad)';
      h+=`<div class="meal"><div style="flex:1"><b><span class="q" style="background:${qc}"></span>${esc(c.tipo)} · ${esc(c.hora)}</b><div class="muted">${esc(c.descripcion||'Sin análisis')}${c.veredicto?' — '+esc(c.veredicto):''}</div>${c.consejo?`<div class="muted">💡 ${esc(c.consejo)}</div>`:''}</div><div class="k">${n(c.kcal)??'—'} kcal</div></div>`});
    h+='</div>';
  }

  // sugerencia de ejercicio
  const lib=n(x.edad)>=45?EJ.suave:EJ.medio;const sug=lib[(G.dia+x.id)%lib.length];
  h+=`<div class="panel"><h2>💪 Ejercicio sugerido hoy</h2><p style="margin:0;font-weight:800">${sug.n}</p><p class="muted" style="margin:4px 0 0">${sug.d}</p></div>`;

  // chisme
  const ch=D.chismes.filter(c=>c.tipo==='diario').slice(-1)[0];
  if(ch)h+=`<div class="panel gossip"><h3>🫢 ${esc(ch.titulo)}</h3><p class="muted" style="margin-bottom:6px">${fmtF(String(ch.fecha).slice(0,10))}</p><p>${esc(ch.texto)}</p></div>`;
  $('casaBody').innerHTML=h;
}

function loginHTML(){

/* ---------- FOTOS ---------- */
function tomarFoto(){
  return new Promise((res,rej)=>{
    const i=document.createElement('input');i.type='file';i.accept='image/*';i.setAttribute('capture','environment');
    i.style.cssText='position:fixed;left:-9999px;opacity:0';document.body.appendChild(i);
    i.onchange=()=>{const f=i.files&&i.files[0];i.remove();if(!f)return rej(new Error('No se tomó foto'));
      if(f.lastModified&&Date.now()-f.lastModified>10*60*1000)return rej(new Error('Esa foto no es de ahora. Tómala con la cámara en este momento.'));res(f)};
    i.click();
  });
}
function comprimir(file,max,q,cuadrada){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      let sx=0,sy=0,sw=im.width,sh=im.height;
      if(cuadrada){const s=Math.min(sw,sh);sx=(sw-s)/2;sy=(sh-s)/2;sw=sh=s}
      const k=Math.min(1,max/Math.max(sw,sh)),cv=document.createElement('canvas');
      cv.width=Math.round(sw*k);cv.height=Math.round(sh*k);
      cv.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',q).split(',')[1]);
    };
    im.onerror=()=>rej(new Error('No pude leer la foto'));im.src=url;
  });
}
async function prepararFoto(file){return{imagen:await comprimir(file,1024,.72),mini:await comprimir(file,240,.55,true)}}

function lineaSVG(vals,color){

    <polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>

}

  if(st==='feliz')y=Math.abs(Math.sin(t*3.4))*.24*m;
  if(st==='normal')y=Math.abs(Math.sin(t*2))*.06*m;
  if(st==='dormida')sy*=.95;
  const k=Math.min(1,dt*5);
  Object.entries({sx,sy,sz,lie,sick,dry,op,y}).forEach(([a,v])=>cur[a]=lerp(cur[a],v,k));cur.bed=lerp(cur.bed,bedY,k);
  let jy=0,spin=0,pulse=0,chomp=0;
  if(anim.jump>0){const p=1-anim.jump;jy=Math.sin(Math.PI*p)*1.3*m;spin=p*Math.PI*2;anim.jump=Math.max(0,anim.jump-dt*1.1)}
  if(anim.drink>0){pulse=Math.sin((1-anim.drink)*Math.PI*3)*.08;anim.drink=Math.max(0,anim.drink-dt*1.2)}
  if(anim.eat>0){chomp=Math.abs(Math.sin((1-anim.eat)*Math.PI*4));anim.eat=Math.max(0,anim.eat-dt*1.2)}
  const breathe=1+Math.sin(t*(st==='dormida'?1.2:2.2))*(st==='dormida'?.05:.025)*m;
  const sob=(st==='preocupado'||st==='enfermo')?Math.abs(Math.sin(t*7))*.03*m:0;
  inner.scale.set(cur.sx*(1+pulse),cur.sy*breathe*(1+pulse+sob),cur.sz*(1+pulse));
  inner.position.set(shiver?Math.sin(t*45)*shiver:0,1+cur.y+jy+cur.bed-(1-cur.sy)*.9,0);
  inner.rotation.z=cur.lie*Math.PI/2*.92+(st==='empachado'?Math.sin(t*1.6)*.08*m:0)+(st==='dormida'?.12:0);
  inner.rotation.y=spin;
  if(!drag){pet.rotation.y+=vel;vel*=.93}
  bodyM.color.copy(new THREE.Color(PS.color).lerp(GREEN,cur.sick*.7).lerp(GRAY,cur.dry*.55));
  mats.forEach(mm=>mm.opacity=cur.op);
  blinkAt-=dt;let blink=1;if(blinkAt<0){blink=.1;if(blinkAt<-.12)blinkAt=2+Math.random()*3}
  const sad=['preocupado','sed','debil','enfermo'].includes(st),shut=st==='uci'||st==='dormida';
  eyes.forEach(e=>{e.visible=!shut&&st!=='muerto';e.scale.y=1.15*(sad?.85:1)*blink});
  hl.forEach(h=>h.visible=!shut&&st!=='muerto'&&blink>.5);
  closed.forEach(c=>c.visible=shut);xs.forEach(x=>x.visible=st==='muerto');
  brows.forEach(b=>{b.visible=sad||st==='uci';b.rotation.z=.4*-b.userData.s});
  beakL.position.y=.86-1-chomp*.08-(st==='sed'?.04:0);tongue.visible=st==='sed';
  wings.forEach(w=>{const s=w.userData.w;w.rotation.z=-.4*s+(st==='feliz'?Math.sin(t*9)*.3*s*m:0)+(sad?.35*s:0)});
  thermo.visible=st==='enfermo';bandage.visible=st==='uci';cap.visible=st==='dormida';
  bed.visible=iv.visible=st==='uci';bag.scale.y=.9+Math.sin(t*2)*.05;
  halo.visible=st==='muerto';halo.position.y=1.28+Math.sin(t*2)*.05;stone.visible=st==='muerto';
  cloud.visible=st==='preocupado'||st==='enfermo';
  if(cloud.visible){cloud.position.x=Math.sin(t*.6)*.15;rain.forEach(r=>{const p=(t*1.3+r.o)%1;r.m.position.set(r.x,-.35-p*1.1,0)})}
  const crying=['preocupado','debil','enfermo'].includes(st);
  tears.forEach(d=>{d.m.visible=crying;if(!crying)return;const p=(t*.9+d.o)%1;d.m.position.set(.31*d.s+.08*d.s*p,.02-p*.7,.9-p*.15)});
  sweat.forEach(d=>{d.m.visible=st==='sed';if(!d.m.visible)return;const p=(t*.8+d.o)%1;d.m.position.set(.78*(d.o>.5?1:-1),.2-p*.8,.5)});
  spawnT-=dt;
  if(spawnT<0){if(st==='feliz'){spawn(heartTex,(Math.random()-.5)*1.4,2.2);spawnT=.7}else if(st==='dormida'){spawn(zTex,.6,2.2);spawnT=1.1}else spawnT=.3}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;p.s.position.y+=dt*.6;p.s.position.x+=Math.sin(p.life*3)*dt*.2;p.s.material.opacity=1-p.life/2.2;if(p.life>2.2){scene.remove(p.s);p.s.material.dispose();parts.splice(i,1)}}
  shadow.scale.setScalar(Math.max(.4,1.05-(cur.y+jy)*.3)*cur.sx);shadow.visible=st!=='uci';
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
}else{$('stage').style.height='120px'}

else{load();setInterval(()=>{const a=document.activeElement;if(D&&!(a&&a.tagName==='INPUT')&&!$('load').classList.contains('on')){calc();render()}},60000);setInterval(()=>{const a=document.activeElement;if(!(a&&a.tagName==='INPUT'))load(true)},5*60000)}
