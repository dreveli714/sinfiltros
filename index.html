<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4B2FD6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sin Filtros</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐣</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--ink:#fff;--ink2:rgba(255,255,255,.76);--glass:rgba(24,15,72,.6);--glass2:rgba(255,255,255,.1);--line:rgba(255,255,255,.17);
--gold:#FFC83D;--mint:#35F0B0;--coral:#FF6B8B;--sky:#4CC9F0;--violet:#9B7BFF;--bad:#FF5470;--good:#35E08F;--warn:#FFB020}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);font-size:17px;line-height:1.45;min-height:100vh;padding:env(safe-area-inset-top,0) 0 100px;
background:linear-gradient(165deg,#4B2FD6 0%,#7B3FE4 42%,#E0509B 100%);background-attachment:fixed}
body.night{background:linear-gradient(165deg,#0E0B2B 0%,#231A5B 55%,#4B2273 100%);background-attachment:fixed}
body::before{content:'';position:fixed;inset:-20%;pointer-events:none;z-index:-1;background:radial-gradient(circle at 18% 12%,rgba(255,255,255,.17),transparent 38%),radial-gradient(circle at 86% 72%,rgba(53,240,176,.16),transparent 42%);animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,3%) scale(1.08)}}
h1,h2,h3,.brand,.big{font-family:'Baloo 2',system-ui,sans-serif;margin:0}
.wrap{max-width:520px;margin:0 auto;padding:10px 14px 20px}
.ic{width:1.35em;height:1.35em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-.25em}
header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.brand{font-size:1.65rem;font-weight:800;flex:1;line-height:1;background:linear-gradient(90deg,#fff,#FFE08A);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-family:'Nunito';font-size:.76rem;color:var(--ink2);-webkit-text-fill-color:var(--ink2);font-weight:800;letter-spacing:.3px}
.hb{border:none;background:var(--glass);color:#fff;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;cursor:pointer;border:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--glass);color:#fff;border-radius:99px;padding:5px 14px 5px 5px;font:inherit;font-weight:800;font-size:.9rem;display:flex;align-items:center;gap:7px;cursor:pointer;height:46px}
.dot{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-size:1.05rem;flex-shrink:0;box-shadow:inset 0 -4px 8px rgba(0,0,0,.18),0 0 0 2px rgba(255,255,255,.35)}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:16px;margin-top:13px;box-shadow:0 12px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.14);animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.panel h2{font-size:1.2rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.muted{color:var(--ink2);font-size:.9rem;line-height:1.45}
.glow{border-color:rgba(255,200,61,.6);box-shadow:0 0 0 1px rgba(255,200,61,.25),0 0 28px rgba(255,200,61,.22),0 12px 30px rgba(0,0,0,.25)}
.bad{border-color:rgba(255,84,112,.6)}
.stage{position:relative;height:min(44vh,370px);touch-action:none;margin-top:2px}
.stage canvas{width:100%;height:100%;display:block}
.bubble{position:absolute;left:50%;top:4px;transform:translateX(-50%);background:#fff;color:#2A1B6B;border-radius:20px;padding:9px 15px;font-weight:800;font-size:.95rem;width:max-content;max-width:92%;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.3);z-index:2}
.bubble::after{content:'';position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.tag{position:absolute;right:2px;bottom:4px;font-family:'Baloo 2';font-weight:800;font-size:.85rem;background:linear-gradient(135deg,var(--gold),#FF9F43);color:#3A2300;padding:3px 12px;border-radius:99px;box-shadow:0 3px 0 #B8650A}
.ecg{position:absolute;left:2px;bottom:4px;width:126px;height:50px;background:#06150F;border-radius:12px;border:2px solid #1F5A40;display:none;overflow:hidden;box-shadow:0 0 16px rgba(70,242,138,.25)}
.ecg.on{display:block}.ecg svg{width:100%;height:100%}
.ecg polyline{fill:none;stroke:#46F28A;stroke-width:2.6;stroke-dasharray:300;animation:ecg 1.6s linear infinite;filter:drop-shadow(0 0 4px #46F28A)}
.ecg.flat polyline{stroke:#FF4B55;animation:none;stroke-dasharray:none;filter:drop-shadow(0 0 4px #FF4B55)}
@keyframes ecg{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
.house{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.house::-webkit-scrollbar{display:none}
.hm{flex-shrink:0;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:5px 12px 5px 5px;display:flex;align-items:center;gap:7px;font-weight:800;font-size:.84rem}
.hm small{display:block;font-size:.7rem;color:var(--ink2);letter-spacing:1px}
.hud{display:flex;align-items:center;gap:14px}
.hud .info{flex:1;min-width:0}
.hud .nm{font-family:'Baloo 2';font-size:1.3rem;font-weight:800;line-height:1.05}
.hud .lv{display:inline-block;background:linear-gradient(135deg,var(--violet),#6C4BFF);padding:1px 10px;border-radius:99px;font-size:.78rem;font-weight:800;margin-left:6px;vertical-align:middle}
.xp{height:13px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;margin:7px 0 4px;position:relative}
.xp i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--sky));position:relative;overflow:hidden}
.xp i::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.6s ease-in-out infinite}
@keyframes shine{to{transform:translateX(100%)}}
.hearts{display:flex;gap:3px}.hearts svg{width:26px;height:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}.hearts svg.on{animation:beat 1.6s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.14)}}
.ring{display:block;overflow:visible}
.ring circle.v{animation:none}
.ring.an circle.v{animation:ringin 1.1s ease-out both}
@keyframes ringin{from{stroke-dashoffset:var(--C)}}
.rt{font-family:'Baloo 2';font-weight:800;font-size:25px;fill:#fff;text-anchor:middle}
.rs{font-family:'Nunito';font-weight:800;font-size:9.5px;fill:rgba(255,255,255,.7);text-anchor:middle;letter-spacing:1.5px}
.rings3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.r3{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:12px 4px 10px;text-align:center}
.r3 .rw{position:relative;width:72px;height:72px;margin:0 auto}
.r3 .rw .ic{position:absolute;inset:0;margin:auto;width:26px;height:26px}
.r3 b{display:block;font-size:.9rem;margin-top:6px;font-family:'Baloo 2'}
.r3 span{font-size:.74rem;color:var(--ink2);font-weight:800}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.act{border:none;border-radius:22px;padding:14px 4px 12px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.02rem;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.1;position:relative;transition:transform .08s}
.act .ic{width:34px;height:34px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.act small{font-family:'Nunito';font-size:.7rem;font-weight:800;opacity:.9}
.act:active{transform:translateY(4px)}.act:disabled{filter:grayscale(.7) brightness(.8)}
.a-f{background:linear-gradient(160deg,#FFB347,#FF6B8B);box-shadow:0 5px 0 #B23A5A,0 12px 20px rgba(0,0,0,.3)}.a-f:active{box-shadow:0 1px 0 #B23A5A}
.a-w{background:linear-gradient(160deg,#6AD7FF,#3A7BFF);box-shadow:0 5px 0 #1F4FB8,0 12px 20px rgba(0,0,0,.3)}.a-w:active{box-shadow:0 1px 0 #1F4FB8}
.a-m{background:linear-gradient(160deg,#5BF0B8,#1FB58A);box-shadow:0 5px 0 #0E7658,0 12px 20px rgba(0,0,0,.3)}.a-m:active{box-shadow:0 1px 0 #0E7658}
.btn{display:block;width:100%;border:none;border-radius:18px;padding:15px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.12rem;cursor:pointer;margin-top:12px;color:#3A2300;background:linear-gradient(180deg,#FFE083,var(--gold));box-shadow:0 5px 0 #B8860B,0 12px 20px rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #B8860B}
.btn:disabled{filter:grayscale(.8) brightness(.8)}
.btn.mint{background:linear-gradient(180deg,#8CFFD9,var(--mint));box-shadow:0 5px 0 #0E9A70,0 12px 20px rgba(0,0,0,.25);color:#04382A}.btn.mint:active{box-shadow:0 1px 0 #0E9A70}
.btn.red{background:linear-gradient(180deg,#FF8FA3,var(--bad));box-shadow:0 5px 0 #A3182F,0 12px 20px rgba(0,0,0,.25);color:#fff}.btn.red:active{box-shadow:0 1px 0 #A3182F}
.btn.ghost{background:var(--glass2);box-shadow:none;color:#fff;border:1px solid var(--line)}.btn.ghost:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.opt{border:2px solid var(--line);background:var(--glass2);color:#fff;border-radius:16px;padding:12px;font:inherit;font-weight:800;font-size:.95rem;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:52px}
.opt small{display:block;font-weight:600;color:var(--ink2);font-size:.76rem}
.opt.sel{border-color:var(--gold);background:rgba(255,200,61,.18)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.cp{border:2px solid var(--line);background:var(--glass2);color:#fff;border-radius:99px;padding:9px 16px;font:inherit;font-weight:800;cursor:pointer}
.cp.sel{border-color:var(--gold);background:rgba(255,200,61,.22);color:#FFE9A8}
input.in,textarea.in{width:100%;padding:14px;border-radius:16px;border:2px solid var(--line);background:rgba(0,0,0,.28);color:#fff;font:inherit;font-weight:800;font-size:1.15rem;text-align:center}
textarea.in{text-align:left;font-size:1rem;font-weight:700;min-height:84px;resize:vertical}
input.in::placeholder,textarea.in::placeholder{color:rgba(255,255,255,.45)}
label.lb{font-weight:800;font-size:.92rem;display:block;margin:12px 0 5px}
.shot{display:flex;align-items:center;gap:10px;border:2px dashed rgba(255,255,255,.35);border-radius:16px;padding:10px;margin-top:8px;cursor:pointer;background:transparent;color:#fff;font:inherit;font-weight:800;width:100%;text-align:left}
.shot img{width:48px;height:48px;object-fit:cover;border-radius:10px}
.meal{display:flex;gap:11px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.meal:first-of-type{border-top:none}
.thumb{width:58px;height:58px;border-radius:16px;background:rgba(0,0,0,.3);overflow:hidden;flex-shrink:0;display:grid;place-items:center;border:2px solid rgba(255,255,255,.25)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
img[data-mini]:not([src]){visibility:hidden}
.meal .mi{flex:1;min-width:0}.meal .mi b{display:block;text-transform:capitalize}
.meal .k{font-family:'Baloo 2';font-weight:800;font-size:1.2rem;text-align:right;line-height:1}.meal .k small{display:block;font-size:.66rem;color:var(--ink2);font-family:'Nunito'}
.dots::after{content:'';animation:dd 1.4s steps(4,end) infinite}
@keyframes dd{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.mis{position:relative;border-radius:26px;padding:2px;background:linear-gradient(135deg,var(--gold),var(--coral),var(--violet),var(--sky));background-size:300% 300%;animation:flow 6s ease infinite;margin-top:13px}
@keyframes flow{50%{background-position:100% 50%}}
.mis>div{background:linear-gradient(160deg,#2D1B7A,#1D1050);border-radius:24px;padding:16px}
.mis .tg{display:inline-block;background:linear-gradient(135deg,var(--gold),#FF9F43);color:#3A2300;border-radius:99px;padding:2px 12px;font-weight:800;font-size:.75rem;letter-spacing:.8px}
.mis h3{font-size:1.3rem;margin:8px 0 4px}.mis .q{font-style:italic;color:#FFE9A8;margin-top:8px;font-weight:700}
.frase{background:linear-gradient(135deg,rgba(255,200,61,.2),rgba(255,107,139,.2));border:1px solid rgba(255,200,61,.5);text-align:center;font-weight:800;font-size:1.05rem;padding:16px 18px}
.frase .ic{color:var(--gold)}
.post{background:var(--glass);border:1px solid var(--line);border-radius:26px;margin-top:13px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.post .hd{display:flex;align-items:center;gap:9px;padding:10px 12px;font-weight:800}.post .hd small{margin-left:auto;color:var(--ink2);font-size:.8rem}
.post .ph{position:relative;background:rgba(0,0,0,.3);aspect-ratio:1;display:grid;place-items:center;cursor:pointer}
.post .ph img{width:100%;height:100%;object-fit:cover;display:block}
.stamp{position:absolute;left:10px;top:10px;padding:4px 11px;border-radius:9px;font-weight:800;font-size:.8rem;background:var(--bad);color:#fff;transform:rotate(-4deg)}
.stamp.eye{background:var(--warn);color:#3A2300}
.post .bd{padding:10px 14px 14px}
.reacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.rx{border:1.5px solid var(--line);background:var(--glass2);color:#fff;border-radius:99px;padding:6px 11px;font:inherit;font-weight:800;font-size:.88rem;cursor:pointer}
.rx.mine{background:rgba(255,200,61,.25);border-color:var(--gold)}
.rx.sus{margin-left:auto;border-color:var(--bad);color:#FFB3C0}
.duel{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}.duel:first-of-type{border-top:none}
.duel .side{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;text-align:center}
.duel .pts{font-family:'Baloo 2';font-size:1.6rem;line-height:1}
.duel .vs{font-family:'Baloo 2';font-weight:800;color:var(--coral);font-size:1.3rem}
.win{color:var(--mint)}
.rank{display:flex;align-items:center;gap:11px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}.rank:first-of-type{border-top:none}
.rank .pos{font-family:'Baloo 2';font-weight:800;width:1.7rem;text-align:center;font-size:1.25rem}
.rank .nm{flex:1;min-width:0;font-weight:800}.rank .nm small{display:block;color:var(--ink2);font-weight:700;font-size:.78rem}
.rank .pt{font-family:'Baloo 2';font-weight:800;font-size:1.4rem;text-align:right;line-height:1}.rank .pt small{display:block;font-family:'Nunito';font-size:.65rem;color:var(--ink2)}
.badge{display:inline-block;font-size:.66rem;font-weight:800;padding:2px 8px;border-radius:7px;background:var(--bad);color:#fff;margin-left:4px;vertical-align:middle}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.num{background:rgba(0,0,0,.26);border-radius:16px;padding:10px;text-align:center}
.num b{display:block;font-family:'Baloo 2';font-size:1.25rem}.num span{font-size:.72rem;color:var(--ink2);font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.cal i{aspect-ratio:1;border-radius:7px;background:rgba(255,255,255,.1);display:block}
.cal i.p{background:#1FD98A}.cal i.o{background:#8FE3B6}.cal i.y{background:#FFD166}.cal i.r{background:#FF5470}.cal i.d{background:#1a1a1a}.cal i.t{outline:2px solid #fff}
.brk{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem}.brk:first-child{border-top:none}
.plates{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.plates button{padding:0;border:3px solid transparent;border-radius:14px;overflow:hidden;aspect-ratio:1;cursor:pointer;background:rgba(0,0,0,.3)}
.plates button.sel{border-color:var(--gold)}.plates img{width:100%;height:100%;object-fit:cover;display:block}
.guide h3{font-size:1.05rem;margin:14px 0 4px}.guide ul{margin:4px 0;padding-left:1.2rem;line-height:1.55}
.bars{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:6px 0}
.ing{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;font-size:.92rem}.ing span:nth-child(3n+2),.ing span:nth-child(3n){text-align:right;color:var(--ink2)}.ing b{font-weight:800}
.sheetbg{position:fixed;inset:0;background:rgba(6,3,28,.7);z-index:60;display:none}.sheetbg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:90vh;overflow:auto;margin:0 auto;max-width:520px;background:linear-gradient(180deg,#32207F,#1A1048);border:1px solid var(--line);border-bottom:none;border-radius:30px 30px 0 0;padding:10px 16px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1);box-shadow:0 -14px 40px rgba(0,0,0,.45)}
.sheet.on{transform:none}.sheet .grab{width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.35);margin:2px auto 12px}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;max-width:500px;margin:0 auto;background:rgba(20,12,62,.88);border:1px solid var(--line);border-radius:26px;display:flex;justify-content:space-around;padding:6px 4px;box-shadow:0 14px 34px rgba(0,0,0,.45)}
nav button{border:none;background:none;color:var(--ink2);font:inherit;font-weight:800;font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 10px;cursor:pointer;border-radius:18px;min-width:62px}
nav button .ic{width:25px;height:25px}
nav button.on{color:#3A2300;background:linear-gradient(180deg,#FFE083,var(--gold));box-shadow:0 3px 0 #B8860B}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#fff;color:#2A1B6B;padding:11px 18px;border-radius:16px;font-weight:800;font-size:.95rem;z-index:90;width:max-content;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s;box-shadow:0 10px 26px rgba(0,0,0,.4)}
.toast.show{opacity:1}
.load{position:fixed;inset:0;background:rgba(6,3,28,.7);z-index:80;display:none;align-items:center;justify-content:center;padding:24px}.load.on{display:flex}
.load>div{background:#2A1B6B;border:1px solid var(--line);border-radius:22px;padding:22px;text-align:center;font-weight:800;max-width:320px}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--gold);margin:0 auto 12px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}
.cf{position:fixed;top:-12px;width:10px;height:14px;z-index:95;pointer-events:none;border-radius:2px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.7}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hidden{display:none!important}
</style>
</head>

const MEM={minis:new Map(),outbox:new Map()};
const IDB_READY=new Promise(res=>{try{const r=indexedDB.open('sinfiltros',1);r.onupgradeneeded=()=>{r.result.createObjectStore('minis');r.result.createObjectStore('outbox')};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}});
const idbOp=(d,s,mode,f)=>new Promise(res=>{try{const t=d.transaction(s,mode),rq=f(t.objectStore(s));t.oncomplete=()=>res(rq?rq.result:undefined);t.onerror=t.onabort=()=>res(undefined)}catch(e){res(undefined)}});
const IDB={
  get:(s,k)=>IDB_READY.then(d=>d?idbOp(d,s,'readonly',o=>o.get(k)):MEM[s].get(k)),
  put:(s,k,v)=>IDB_READY.then(d=>d?idbOp(d,s,'readwrite',o=>o.put(v,k)):MEM[s].set(k,v)),
  del:(s,k)=>IDB_READY.then(d=>d?idbOp(d,s,'readwrite',o=>o.delete(k)):MEM[s].delete(k)),
  all:s=>IDB_READY.then(d=>d?idbOp(d,s,'readonly',o=>o.getAll()):[...MEM[s].values()])
};
const MINI={};let MINI_BUSY=false;
async function minisPara(ids){
  const falta=[];
  for(const id of ids){if(MINI[id])continue;const v=await IDB.get('minis',id);if(v)MINI[id]=v;else falta.push(id)}

    const lote=falta.splice(0,12);
    try{const r=await getJ(API+'?accion=minis&ids='+lote.join(','));

  }
}

/* ================= CÁLCULOS ================= */
function primerLunes(ini){return addDays(ini,((8-dow(ini))%7)||7)}
function semanaDe(f,ini){const L=primerLunes(ini);if(f<L)return 1;return 2+Math.floor((toUTC(f)-toUTC(L))/(7*864e5))}
function inicioSemana(w,ini){return w===1?ini:addDays(primerLunes(ini),7*(w-2))}
function finSemana(w,ini,fin){const L=primerLunes(ini);const f=w===1?addDays(L,-1):addDays(L,7*(w-1)-1);return f>fin?fin:f}
function metaKcal(p,kg){const est=n(p.estatura_cm),ed=n(p.edad);if(!kg||!est||!ed)return 1500;return Math.max(1300,Math.round(((10*kg+6.25*est-5*ed-161)*1.375-400)/50)*50)}
function estadoPollita(x,H){
  if(x.dead)return'muerto';
  if(x.bad>=3||x.dryNow>=5)return'uci';
  if(x.bad>=2||x.dryNow>=2)return'enfermo';
  if(!x.awake)return'dormida';
  if(x.water<30)return'sed';
  if(x.ratio>x.hi||x.bomba)return'empachado';
  if(H>=15&&!x.lunch)return'debil';
  if(x.bad>=1)return'preocupado';
  const ex=clamp((H-10)/10,0,1);
  if(x.water>55&&x.ratio>=ex*.45&&x.move>=ex*15)return'feliz';
  return'normal';
}
function calc(){
  const c=D.config,ini=String(c.fecha_inicio).slice(0,10),fin=String(c.fecha_fin).slice(0,10);
  const hoy=hoyStr(),H=hNow(),hoyC=hoy>fin?fin:(hoy<ini?ini:hoy);
  const act=D.participantes.filter(p=>p.nombre&&!['FALSE','FALSO'].includes(String(p.activo).trim().toUpperCase())).map(p=>Object.assign({},p,{id:Number(p.id)}));
  const owner={},fechaFoto={};
  D.comidas.forEach(x=>{owner[x.id]=Number(x.participante_id);fechaFoto[x.id]=x.fecha});
  D.ejercicio.forEach(x=>{owner[x.id]=Number(x.participante_id);fechaFoto[x.id]=x.fecha});
  const need=Math.max(1,Math.min(2,act.length-1));
  const den={};D.denuncias.forEach(d=>{const o=owner[d.foto_id];if(o===undefined||o===Number(d.participante_id))return;(den[d.foto_id]=den[d.foto_id]||new Set()).add(Number(d.participante_id))});
  const anul=new Set(Object.keys(den).filter(k=>den[k].size>=need));
  const req=[ini];for(let w=1;;w++){const f=finSemana(w,ini,fin);if(!req.includes(f))req.push(f);if(f>=fin)break}

  const P=act.map(p=>{
    const id=p.id,desde=String(p.desde||ini).slice(0,10)||ini;
    const com=D.comidas.filter(x=>Number(x.participante_id)===id&&!anul.has(x.id));
    const comBy=groupBy(com,'fecha');
    const agBy=groupBy(D.agua.filter(x=>Number(x.participante_id)===id),'fecha');
    const ejAll=D.ejercicio.filter(x=>Number(x.participante_id)===id);
    const ejBy=groupBy(ejAll.filter(x=>x.estado!=='rechazado'&&!anul.has(x.id)),'fecha');
    const outMin=OUT.filter(o=>o.accion==='ejercicio_subir'&&o.datos.pid===id&&o.datos.fecha===hoy).reduce((s,o)=>s+(n(o.datos.minutos)||0),0);
    const pes=D.pesajes.filter(x=>Number(x.participante_id)===id&&n(x.peso_kg)).sort((a,b)=>String(a.fecha)<String(b.fecha)?-1:1);
    const pesoIni=pes.length?n(pes[0].peso_kg):null,cintIni=pes.length?n(pes[0].cintura_cm):null;
    const pesoAct=pes.length?n(pes[pes.length-1].peso_kg):null,cintAct=pes.length?n(pes[pes.length-1].cintura_cm):null;
    const meta=metaKcal(p,pesoAct);
    function evalDay(f,until){
      const cs=comBy[f]||[],ok=cs.filter(x=>n(x.kcal)!==null);
      const kcal=ok.reduce((s,x)=>s+n(x.kcal),0);
      const qs=ok.filter(x=>n(x.calidad)!==null),q=qs.length?qs.reduce((s,x)=>s+n(x.calidad),0)/qs.length:0;
      const lunch=cs.some(x=>x.tipo==='almuerzo'),hi=f>=DEC?1.35:1.2,ratio=kcal/meta;
      const foodOk=lunch&&ratio>=.6&&ratio<=hi&&q>=.45;
      const hrs=(agBy[f]||[]).map(x=>hDe(x.hora)).filter(h=>h!==null&&h>=10&&h<20).sort((a,b)=>a-b);
      let prev=10,dry=0;hrs.forEach(h=>{dry+=Math.max(0,h-prev-3);prev=h});dry+=Math.max(0,until-prev-3);
      const move=(ejBy[f]||[]).reduce((s,x)=>s+(n(x.minutos)||0),0)+(f===hoy?outMin:0);
      const waterOk=dry<2,moveOk=move>=15,fails=[foodOk,waterOk,moveOk].filter(v=>!v).length;
      const rs=ratio>=.7&&ratio<=hi?1:ratio<.7?ratio/.7:Math.max(0,1-(ratio-hi)/.5);
      const food=cs.length?(rs*.55+q*.45)*(lunch?1:.75):0;
      const health=Math.round(100*(.4*food+.3*clamp(1-dry/6,0,1)+.3*Math.min(1,move/30)));
      return{f,kcal,q,lunch,ratio,hi,foodOk,dry,waterOk,move,moveOk,fails,perfect:fails===0&&move>=30,health,pts:Math.round(health/10),
        sanos:ok.filter(x=>n(x.calidad)>=.7).length,meals:cs,pend:cs.length-ok.length,bomba:ok.some(x=>n(x.calidad)!==null&&n(x.calidad)<.15&&n(x.kcal)>=600)};
    }
    const rev=D.revivir.filter(x=>Number(x.participante_id)===id).map(x=>String(x.fecha).slice(0,10));
    let bad=0,dead=false,deaths=0,lost=0,revives=0;const days=[];
    for(let f=desde;f<hoy&&f<=fin;f=addDays(f,1)){
      rev.filter(r=>r===f).forEach(()=>{if(dead){dead=false;bad=2;revives++}});
      if(dead){days.push({f,dead:true,fails:3,move:0,sanos:0,health:0,pts:0});continue}
      const e=evalDay(f,20);
      if(e.fails>=2){bad++;lost++;e.lost=true}else if(e.fails===0&&bad>0){bad--;e.won=true}
      if(bad>=4){dead=true;deaths++;e.died=true}
      days.push(e);
    }
    rev.filter(r=>r===hoy).forEach(()=>{if(dead){dead=false;bad=2;revives++}});
    const today=evalDay(hoy,Math.min(H,20));
    const awake=H>=10&&H<20&&hoy>=desde&&hoy<=fin;
    const td=(agBy[hoy]||[]).map(x=>hDe(x.hora)).filter(h=>h!==null&&h>=10&&h<=H+.01).sort((a,b)=>a-b);
    const last=td.length?td[td.length-1]:null,base=last!==null?100:60,since=awake?H-(last??10):0;
    const water=awake?clamp(base-since*33.33):(last!==null?100:60),dryNow=awake?Math.max(0,since-base/33.33):0;
    const st=hoy<desde||hoy<ini?'normal':estadoPollita({dead,bad,dryNow,awake,water,ratio:today.ratio,hi:today.hi,bomba:today.bomba,lunch:today.lunch,move:today.move},H);
    const hist=days.slice(-6).map(e=>e.dead?0:e.health).concat([today.health]);
    const salud=dead?0:Math.round(hist.reduce((s,v)=>s+v,0)/hist.length);
    const pesF=new Set(pes.map(x=>String(x.fecha).slice(0,10)));
    let ptsPes=0;req.filter(r=>r>=desde).forEach(r=>{if(pesF.has(r)||pesF.has(addDays(r,1)))ptsPes+=5;else if(hoy>addDays(r,1))ptsPes-=5});
    return Object.assign({},p,{com,ejAll,pes,pesoIni,cintIni,pesoAct,cintAct,meta,days,today,bad,dead,deaths,lost,revives,water,dryNow,awake,st,salud,pesF,ptsPes,desde,
      anuladas:[...anul].filter(k=>owner[k]===id),acertadas:[...anul].filter(k=>den[k].has(id)).length});
  });
  const byId={};P.forEach(x=>byId[x.id]=x);
  const curW=semanaDe(hoyC,ini),weeks=[],ids=P.map(x=>x.id).sort((a,b)=>a-b);
  function pares(w){const arr=ids.slice();if(arr.length%2)arr.push(0);const m=arr.length;if(m<2)return[];const rest=arr.slice(1),k=(w-1)%(m-1),rot=rest.slice(k).concat(rest.slice(0,k)),all=[arr[0]].concat(rot),out=[];for(let i=0;i<m/2;i++)out.push([all[i],all[m-1-i]]);return out}
  function wk(x,w){
    const a=inicioSemana(w,ini),b=finSemana(w,ini,fin);let pts=0,move=0,water=0,food=0,perfect=0;
    x.days.filter(e=>e.f>=a&&e.f<=b&&!e.dead).forEach(e=>{pts+=e.pts;move+=e.move;if(e.waterOk)water++;if(e.foodOk)food++;if(e.perfect)perfect++});
    if(hoy>=a&&hoy<=b){pts+=x.today.pts;move+=x.today.move}
    if(x.pesF.has(b)||x.pesF.has(addDays(b,1)))pts+=5;
    return{pts,move,water,food,perfect};
  }
  for(let w=1;w<=curW;w++){
    const a=inicioSemana(w,ini),b=finSemana(w,ini,fin),done=hoy>b,st={};
    P.forEach(x=>st[x.id]=wk(x,w));
    const avg=P.length?Math.round(P.reduce((s,x)=>s+st[x.id].pts,0)/P.length):0;
    const duels=pares(w).map(([i,j])=>{const pi=i?st[i].pts:avg,pj=j?st[j].pts:avg;return{a:i,b:j,pa:pi,pb:pj,win:done?(pi>pj?i:pj>pi?j:'empate'):null}});
    const v=(D.votos||{})[w]||{};let nominadas=[],platoWin=[];
    if(v.cerrada){const nm=v.nominaciones||{},mx=Math.max(0,...Object.values(nm));if(mx>0)nominadas=Object.keys(nm).filter(k=>nm[k]===mx).map(Number);
      const pl=v.platos||{},mp=Math.max(0,...Object.values(pl));if(mp>0)platoWin=Object.keys(pl).filter(k=>pl[k]===mp)}
    weeks.push({w,a,b,done,st,duels,v,nominadas,platoWin,reto:RETOS_SALV[hash('s'+w)%RETOS_SALV.length]});
  }
  P.forEach(x=>{
    const B={};
    B['Salud de la pollita']=x.days.reduce((s,e)=>s+e.pts,0)+x.today.pts;
    B['Días perfectos']=x.days.concat([x.today]).reduce((s,e)=>s+(e.perfect?(e.f>=DEC?6:3):0),0);
    B['Pesajes']=x.ptsPes;
    B['Cintura']=(x.cintIni&&x.cintAct)?Math.round((x.cintIni-x.cintAct)*3):0;
    B['Peso']=(x.pesoIni&&x.pesoAct)?Math.round((x.pesoIni-x.pesoAct)/x.pesoIni*100*3):0;
    let du=0,pl=0,nom=0,salv=0;
    weeks.forEach(W=>{
      W.duels.forEach(d=>{if(!d.win)return;if(d.win===x.id)du+=8;else if(d.win==='empate'&&(d.a===x.id||d.b===x.id))du+=3});
      if(W.platoWin.some(fid=>owner[fid]===x.id))pl+=5;
      if(W.nominadas.includes(x.id)){nom-=5;const N=weeks[W.w];if(N&&N.done)salv+=W.reto.ok(N.st[x.id])?10:-10}
    });
    B['Duelos']=du;B['Mejor plato']=pl;B['Nominaciones']=nom;B['Reto de salvación']=salv;
    B['Trampas detectadas']=x.acertadas*10;B['Fotos anuladas']=-15*x.anuladas.length;
    B['Vidas perdidas']=-5*x.lost;B['Muertes']=-20*x.deaths;B['Revivir']=-20*x.revives;
    B['Fotos de progreso']=3*new Set(D.progreso.filter(r=>Number(r.participante_id)===x.id).map(r=>r.fecha)).size;
    const bd=x.pes.filter(r=>String(r.fecha)<=DEC).pop(),fp=x.pes.filter(r=>String(r.fecha)>=fin).pop();
    B['Sobrevivir diciembre']=(bd&&fp&&n(fp.peso_kg)<=n(bd.peso_kg))?20:0;
    x.B=B;x.pts=Object.values(B).reduce((s,v)=>s+v,0);
    x.tramposa=x.anuladas.some(k=>fechaFoto[k]>=addDays(hoy,-7));
  });
  const ranking=P.slice().sort((a,b)=>b.pts-a.pts);
  G={ini,fin,hoy,H,hoyC,P,byId,weeks,curW,ranking,anul,den,owner,need,req,
    dia:Math.max(1,Math.min(Math.round((toUTC(hoyC)-toUTC(ini))/864e5)+1,92)),total:Math.round((toUTC(fin)-toUTC(ini))/864e5)+1};
}

function go(t){tab=t;FX.anim=true;if(t==='feed')ui.feedN=12;if(t==='ranking')ui.progFotos=null;render();window.scrollTo({top:0})}
function render(){
  if(!G)return;
  document.body.classList.toggle('night',!(G.H>=10&&G.H<20));
  $('dayChip').textContent=G.hoy<G.ini?'Empieza el '+fmtF(G.ini):(G.hoy>G.fin?'¡Terminó el reto!':'Día '+G.dia+' de '+G.total+' · Semana '+G.curW);
  const m=me&&G.byId[me];
  $('userChip').innerHTML=m?`<span class="dot" style="background:${m.color}">${EMO[m.st]}</span>${esc(m.nombre)}`:`<span class="dot" style="background:rgba(255,255,255,.2)">${ic('user')}</span>Entrar`;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('vCasa').classList.toggle('hidden',tab!=='casa');$('vOtro').classList.toggle('hidden',tab==='casa');
  ({casa:renderCasa,feed:renderFeed,semana:renderSemana,ranking:renderRanking,metas:renderMetas,guia:renderGuia})[tab]();
  if(FX.anim)setTimeout(()=>FX.anim=false,1500);
}

const dotP=(x,sz)=>`<span class="dot" style="background:${x?x.color:'#aaa'};${sz?`width:${sz}px;height:${sz}px;font-size:${sz/2.1}px`:''}">${x?EMO[x.st]:'👻'}</span>`;

function renderCasa(){
  $('house').innerHTML=G.P.filter(x=>x.id!==me).map(x=>`<div class="hm">${dotP(x)}<div>${esc(x.nombre)} · ${LABEL[x.st]}<small>${'❤️'.repeat(4-Math.min(x.bad,4))}${'🖤'.repeat(Math.min(x.bad,4))}</small></div></div>`).join('');
  if(!me||!G.byId[me]){petSet({st:'normal',color:'#FFD84D',water:80,awake:true,name:'Pío'});$('casaBody').innerHTML=loginHTML();return}
  const x=G.byId[me],t=x.today;petSet({st:x.st,color:x.color||'#FFD84D',water:x.water,awake:x.awake,name:x.nombre});

  <div class="info"><div class="nm">${esc(x.nombre)}<span class="lv">Nv ${lvl+1} · ${TIT[lvl]}</span></div><div class="xp"><i style="width:${xp}%"></i></div><div class="muted" style="margin-bottom:6px">${x.pts} puntos · ${lvl<6?Math.round(150-(x.pts%150))+' para subir de nivel':'nivel máximo'}</div>${heartsHTML(x)}</div></div>`;
  h+=`<div class="panel frase">${ic('sparkle')} ${esc(fraseHoy())}</div>`;
  const r=t.ratio,fc=(r>=.6&&r<=t.hi)?['#35E08F','#B8FF6B']:r>t.hi?['#FF5470','#FF9A5B']:['#FFB020','#FFD86B'];
  h+=`<div class="rings3" style="margin-top:13px">
   <div class="r3"><div class="rw">${ring(clamp(r*100),fc[0],fc[1],72,'')}${ic('fork')}</div><b>Comida</b><span>${t.kcal} / ${x.meta} kcal${t.pend?' · +'+t.pend+' por contar':''}</span></div>
   <div class="r3"><div class="rw">${ring(x.awake?x.water:100,'#4CC9F0','#6AD7FF',72,'')}${ic('drop')}</div><b>Agua</b><span>${x.awake?Math.round(x.water)+'%':'durmiendo'}</span></div>
   <div class="r3"><div class="rw">${ring(clamp(t.move/30*100),'#35F0B0','#B8FF6B',72,'')}${ic('bolt')}</div><b>Movimiento</b><span>${t.move} / 30 min</span></div></div>`;
  if(x.dead)h+=`<button class="btn red" type="button" onclick="revivir()">⚡ Revivir a mi pollita (−20 puntos, lo ven todas)</button>`;
  else h+=`<div class="acts">
   <button class="act a-f" type="button" onclick="menuComida()">${ic('cam')}Comida<small>foto del plato</small></button>
   <button class="act a-w" type="button" onclick="darAgua()" ${x.awake?'':'disabled'}>${ic('drop')}Agua<small>${x.awake?'+1 vaso':'de 10 a 20'}</small></button>
   <button class="act a-m" type="button" onclick="menuEjercicio()">${ic('bolt')}Ejercicio<small>reloj o zapatos</small></button></div>`;
  if(ui.last)h+=`<div class="panel glow"><h2>${esc(ui.last.titulo)}</h2><p style="margin:0;font-weight:800">${esc(ui.last.txt)}</p>${ui.last.sub?`<p class="muted" style="margin-top:6px">${esc(ui.last.sub)}</p>`:''}</div>`;
  // comidas de hoy (incluye las que aún se están subiendo)
  const lista=t.meals.map(c=>({id:c.id,ts:n(c.ts)||0,tipo:c.tipo,hora:c.hora,c}))
    .concat(OUT.filter(o=>o.accion==='comida_subir'&&o.datos.pid===me&&o.datos.fecha===hoy&&!t.meals.some(c=>c.id===o.id)).map(o=>({id:o.id,ts:o.datos.ts,tipo:o.datos.tipo,hora:o.datos.hora,out:o})))
    .sort((a,b)=>a.ts-b.ts);
  if(lista.length){h+=`<div class="panel"><h2>${ic('fork')} Lo que comiste hoy</h2>`;
    lista.forEach(it=>{
      let sub,k='';

  const prf=[hoy,addDays(hoy,-1)].find(f=>PROG_FECHAS.includes(f)&&!D.progreso.some(q=>Number(q.participante_id)===me&&q.fecha===f));
  if(prf)h+=`<div class="panel glow"><h2>${ic('cam')} Foto de progreso (privada)</h2><p class="muted">Cuerpo completo, de frente, misma pose y mismo lugar cada mes. Solo la ves tú. +3 puntos.</p><button class="btn" type="button" onclick="fotoProgreso('${prf}')">Tomar foto de progreso</button></div>`;
  // misión
  const lib=MIS[ui.mis||(n(x.edad)>=45?'suave':'medio')],ms=lib[(G.dia+x.id)%lib.length],lv=ui.mis||(n(x.edad)>=45?'suave':'medio');
  h+=`<div class="mis"><div><span class="tg">MISIÓN DE HOY</span><h3>${ms.t}</h3><p style="margin:0">${ms.d}</p><p class="q">“${ms.q}”</p>
   <div class="chips" style="margin-top:12px"><button class="cp ${lv==='suave'?'sel':''}" type="button" onclick="ui.mis='suave';renderCasa()">Suave</button><button class="cp ${lv==='medio'?'sel':''}" type="button" onclick="ui.mis='medio';renderCasa()">Intensa</button></div>
   <p class="muted" style="margin:6px 0 0">Plan express: ¿día difícil? 10 minutos de marcha en el sitio ya te ponen en movimiento. 💛 Al terminar, registra tu ejercicio.</p></div></div>`;
  const ch=D.chismes.filter(q=>q.tipo==='diario').slice(-1)[0];
  if(ch)h+=`<div class="panel"><h2>🫢 ${esc(ch.titulo)}</h2><p class="muted" style="margin:0 0 6px">${fmtF(String(ch.fecha).slice(0,10))}</p><p style="margin:0;line-height:1.55">${esc(ch.texto)}</p></div>`;
  $('casaBody').innerHTML=h;pintarMinis();
  minisPara(lista.map(i=>i.id));
}
function fraseHoy(){
  if(FR&&FR.fecha===hoyStr())return FR.frase;
  const c=LS.get('sf_frase_'+me);if(c){try{const j=JSON.parse(c);if(j.fecha===hoyStr())return j.frase}catch(e){}}
  return FRASES[(hash(String(me)+hoyStr()))%FRASES.length];
}
function loginHTML(){

/* ================= FOTOS Y COLA DE SUBIDA ================= */
function tomarFoto(){
  return new Promise((res,rej)=>{
    const i=document.createElement('input');i.type='file';i.accept='image/*';i.setAttribute('capture','environment');
    i.style.cssText='position:fixed;left:-9999px;opacity:0';document.body.appendChild(i);
    i.onchange=()=>{const f=i.files&&i.files[0];i.remove();if(!f)return rej(new Error('No se tomó foto'));
      if(f.lastModified&&Date.now()-f.lastModified>10*60*1000)return rej(new Error('Esa foto no es de ahora. Tómala con la cámara en este momento.'));res(f)};
    i.click();
  });
}
function comprimir(file,max,q,cuadrada){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{let sx=0,sy=0,sw=im.width,sh=im.height;
      if(cuadrada){const s=Math.min(sw,sh);sx=(sw-s)/2;sy=(sh-s)/2;sw=sh=s}
      const k=Math.min(1,max/Math.max(sw,sh)),cv=document.createElement('canvas');cv.width=Math.round(sw*k);cv.height=Math.round(sh*k);
      cv.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,cv.width,cv.height);URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',q).split(',')[1])};
    im.onerror=()=>rej(new Error('No pude leer la foto'));im.src=url;
  });
}
async function prepararFoto(file){return{imagen:await comprimir(file,900,.7),mini:await comprimir(file,240,.55,true)}}
const sello=()=>({fecha:hoyStr(),hora:horaStr(),ts:Date.now()});

async function enqueue(it){OUT.push(it);await IDB.put('outbox',it.id,it);calc();if(tab==='casa')renderCasa();flushOut()}
let FLUSH=false;
async function flushOut(){
  if(FLUSH)return;FLUSH=true;
  try{
    for(const it of OUT.slice()){
      try{
        await post(it.accion,it.datos,90000);
        OUT=OUT.filter(x=>x.id!==it.id);await IDB.del('outbox',it.id);
        await load(true);
        analizar(it.accion==='comida_subir'?'comida':'ejercicio',it.id);
      }catch(e){it.err=e.message;break}
    }
  }finally{FLUSH=false}
  if(OUT.length)setTimeout(flushOut,12000);
}
async function outInit(){try{OUT=((await IDB.all('outbox'))||[]).filter(Boolean)}catch(e){OUT=[]}if(OUT.length)flushOut()}
window.addEventListener('online',()=>{if(OUT.length)flushOut();load(true)});

function suave(pts){if(pts.length<3)return'M'+pts.map(p=>p.join(',')).join(' L');let d='M'+pts[0].join(',');for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}return d}
function chartLinea(vals,labels,c1,c2,unit,meta){
  const ok=vals.map((v,i)=>({v,l:labels[i]})).filter(o=>o.v!==null);if(ok.length<2)return'<p class="muted">Aún no hay suficientes pesajes para graficar.</p>';
  const W=330,H=170,L=40,R=16,T=18,B=28,all=ok.map(o=>o.v).concat(meta?[meta]:[]),mn=Math.min(...all),mx=Math.max(...all),pd=(mx-mn)*.18||1,lo=mn-pd,hi=mx+pd;
  const X=i=>L+i*(W-L-R)/(ok.length-1),Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B),pts=ok.map((o,i)=>[X(i),Y(o.v)]),id='cl'+(++RID);
  const line=suave(pts),area=line+` L${pts[pts.length-1][0]},${H-B} L${pts[0][0]},${H-B} Z`,last=pts[pts.length-1];
  const grid=[0,1,2].map(k=>{const v=lo+(hi-lo)*k/2,y=Y(v);return `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.12)" stroke-dasharray="3 5"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" font-weight="700" fill="rgba(255,255,255,.65)">${r1(v)}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Gráfica de ${unit}: de ${ok[0].v} a ${ok[ok.length-1].v}"><defs><linearGradient id="${id}a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}" stop-opacity=".55"/><stop offset="1" stop-color="${c1}" stop-opacity="0"/></linearGradient><linearGradient id="${id}l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
  ${grid}${meta?`<line x1="${L}" x2="${W-R}" y1="${Y(meta)}" y2="${Y(meta)}" stroke="#FFC83D" stroke-width="2" stroke-dasharray="6 5"/><text x="${W-R}" y="${Y(meta)-6}" text-anchor="end" font-size="11" font-weight="800" fill="#FFC83D">🎯 Meta ${meta}</text>`:''}
  <path d="${area}" fill="url(#${id}a)"/><path d="${line}" fill="none" stroke="url(#${id}l)" stroke-width="3.5" stroke-linecap="round" style="filter:drop-shadow(0 0 5px ${c2}aa)"/>
  ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?6:3.6}" fill="${i===pts.length-1?'#fff':c2}" stroke="${c1}" stroke-width="2"/>`).join('')}
  <rect x="${Math.min(last[0]-26,W-R-52)}" y="${last[1]-31}" width="52" height="21" rx="10" fill="#fff"/><text x="${Math.min(last[0],W-R-26)}" y="${last[1]-16}" text-anchor="middle" font-size="12" font-weight="800" fill="#2A1B6B">${ok[ok.length-1].v}</text>
  <text x="${L}" y="${H-8}" font-size="11" font-weight="700" fill="rgba(255,255,255,.65)">${ok[0].l}</text><text x="${W-R}" y="${H-8}" text-anchor="end" font-size="11" font-weight="700" fill="rgba(255,255,255,.65)">${ok[ok.length-1].l}</text></svg>`;
}
function chartSalud(days){

  spawnT-=dt;if(spawnT<0){if(st==='feliz'){spawn(heartTex,(Math.random()-.5)*1.4,2.2);spawnT=.7}else if(st==='dormida'){spawn(zTex,.6,2.2);spawnT=1.1}else spawnT=.3}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;p.s.position.y+=dt*.6;p.s.position.x+=Math.sin(p.life*3)*dt*.2;p.s.material.opacity=1-p.life/2.2;if(p.life>2.2){scene.remove(p.s);p.s.material.dispose();parts.splice(i,1)}}
  const pa=sparkG.attributes.position;for(let i=0;i<SN;i++){let yy=pa.getY(i)+dt*.18*m;if(yy>4.6)yy=0;pa.setY(i,yy)}pa.needsUpdate=true;
  glowRing.material.color.setHSL(.45+Math.sin(t*.8)*.05,.9,.6);
  shadow.scale.setScalar(Math.max(.4,1.05-(cur.y+jy)*.3)*cur.sx);shadow.visible=st!=='uci';renderer.render(scene,camera);
}
requestAnimationFrame(frame);
}else{$('stage').style.height='110px'}

else{
  outInit();load();cargarObj();
  setInterval(()=>{const a=document.activeElement;if(D&&!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))&&!$('load').classList.contains('on')&&!$('sheet').classList.contains('on')){calc();render()}},60000);
  setInterval(()=>{const a=document.activeElement;if(!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')))load(true)},4*60000);
}
